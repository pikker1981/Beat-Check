<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>드럼 출결 관리</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --black:#000000;
  --near-black:#262626;
  --darkest:#090909;
  --white:#ffffff;
  --snow:#fafafa;
  --light-gray:#e5e5e5;
  --stone:#737373;
  --silver:#a3a3a3;
  --mid-gray:#525252;
  --btn-dark:#404040;
  --border-light:#d4d4d4;
}

body{
  font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--white);
  color:var(--near-black);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3,.display{
  font-family:"SF Pro Rounded","SF Pro Display",system-ui,-apple-system,sans-serif;
  font-weight:500;
}

/* ── Nav ── */
nav{
  border-bottom:1px solid var(--light-gray);
  padding:0 24px;
  height:56px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  background:var(--white);
  z-index:10;
}
.nav-brand{
  font-family:"SF Pro Rounded",system-ui,-apple-system,sans-serif;
  font-weight:500;
  font-size:17px;
  color:var(--black);
  display:flex;
  align-items:center;
  gap:8px;
}
.nav-brand svg{fill:none;stroke:var(--black);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav-today-btn{
  font-size:13px;
  font-weight:400;
  color:var(--stone);
  background:none;
  border:1px solid var(--light-gray);
  border-radius:9999px;
  padding:5px 14px;
  cursor:pointer;
  transition:background .15s,color .15s;
}
.nav-today-btn:hover{background:var(--light-gray);color:var(--near-black)}

/* ── Layout ── */
.app{
  max-width:760px;
  margin:0 auto;
  padding:32px 24px 80px;
}

/* ── Month header ── */
.month-nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:24px;
}
.month-title{
  font-size:22px;
  font-family:"SF Pro Rounded",system-ui,-apple-system,sans-serif;
  font-weight:500;
  color:var(--black);
}
.nav-arrows{display:flex;gap:6px}
.arrow-btn{
  width:34px;height:34px;
  border-radius:9999px;
  border:1px solid var(--light-gray);
  background:var(--white);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.arrow-btn:hover{background:var(--light-gray)}
.arrow-btn svg{stroke:var(--near-black);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ── Calendar ── */
.cal-wrap{
  border:1px solid var(--light-gray);
  border-radius:12px;
  overflow:hidden;
}
.cal-header{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  border-bottom:1px solid var(--light-gray);
}
.cal-header-cell{
  text-align:center;
  padding:10px 0;
  font-size:11px;
  font-weight:500;
  color:var(--silver);
  letter-spacing:.05em;
  text-transform:uppercase;
}
.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
}
.cal-day{
  aspect-ratio:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:14px;
  color:var(--near-black);
  cursor:default;
  position:relative;
  gap:4px;
  border-right:1px solid var(--light-gray);
  border-bottom:1px solid var(--light-gray);
  transition:background .12s;
  user-select:none;
}
.cal-day:nth-child(7n){border-right:none}
.cal-day.empty{background:var(--snow)}
.cal-day.other-month{color:var(--silver)}
.cal-day.has-class{
  cursor:pointer;
}
.cal-day.has-class:hover{background:var(--snow)}
.cal-day.today .day-num{
  background:var(--light-gray);
  border-radius:9999px;
  width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  font-weight:500;
}
.cal-day.selected .day-num{
  background:var(--black);
  color:var(--white);
  border-radius:9999px;
  width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  font-weight:500;
}
.cal-day.selected.today .day-num{
  background:var(--black);
  color:var(--white);
}
.day-num{
  width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;
}
.day-dots{
  display:flex;gap:3px;
  height:5px;
  align-items:center;
}
.day-dot{
  width:4px;height:4px;
  border-radius:9999px;
  background:var(--silver);
}
.cal-day.selected .day-dot{background:rgba(255,255,255,.6)}

/* ── Detail panel ── */
.detail-panel{
  margin-top:20px;
  border:1px solid var(--light-gray);
  border-radius:12px;
  overflow:hidden;
  animation:slideDown .2s ease;
}
@keyframes slideDown{
  from{opacity:0;transform:translateY(-8px)}
  to{opacity:1;transform:translateY(0)}
}
.detail-date-bar{
  padding:14px 20px;
  border-bottom:1px solid var(--light-gray);
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--snow);
}
.detail-date-label{
  font-family:"SF Pro Rounded",system-ui,-apple-system,sans-serif;
  font-size:15px;
  font-weight:500;
  color:var(--black);
}
.attendance-summary{
  font-size:12px;
  color:var(--stone);
  background:var(--white);
  border:1px solid var(--light-gray);
  border-radius:9999px;
  padding:4px 12px;
}

/* ── Session block ── */
.session-block{
  padding:20px;
  border-bottom:1px solid var(--light-gray);
}
.session-block:last-child{border-bottom:none}
.session-header{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:14px;
}
.session-location{
  font-size:12px;
  color:var(--stone);
  font-weight:400;
}
.session-time-badge{
  font-size:11px;
  color:var(--mid-gray);
  background:var(--light-gray);
  border-radius:9999px;
  padding:2px 10px;
  font-weight:500;
}
.student-list{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

/* ── Student pill ── */
.student-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 16px;
  border-radius:9999px;
  border:1px solid var(--light-gray);
  background:var(--white);
  color:var(--btn-dark);
  font-size:14px;
  font-weight:400;
  cursor:pointer;
  transition:background .12s,color .12s,border-color .12s,transform .08s;
  position:relative;
}
.student-pill:hover{
  background:var(--snow);
  border-color:var(--silver);
}
.student-pill:active{transform:scale(.97)}
.student-pill.present{
  background:var(--black);
  color:var(--white);
  border-color:var(--black);
}
.student-pill.present:hover{
  background:#222;
}
.student-pill.absent{
  background:var(--white);
  color:var(--silver);
  border-color:var(--light-gray);
  text-decoration:line-through;
  text-decoration-color:var(--silver);
}
.student-pill .pill-check{
  width:14px;height:14px;
  display:none;
}
.student-pill.present .pill-check{display:block}
.student-pill .pill-x{
  width:14px;height:14px;
  display:none;
}
.student-pill.absent .pill-x{display:block}

/* ── Stats section ── */
.stats-section{
  margin-top:32px;
}
.stats-title{
  font-size:13px;
  color:var(--stone);
  margin-bottom:16px;
  font-weight:500;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:10px;
}
.stat-card{
  border:1px solid var(--light-gray);
  border-radius:12px;
  padding:16px;
  background:var(--white);
}
.stat-name{
  font-size:13px;
  color:var(--stone);
  margin-bottom:8px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.stat-bar-row{
  display:flex;
  align-items:center;
  gap:8px;
}
.stat-bar-bg{
  flex:1;
  height:4px;
  background:var(--light-gray);
  border-radius:9999px;
  overflow:hidden;
}
.stat-bar-fill{
  height:100%;
  background:var(--black);
  border-radius:9999px;
  transition:width .4s ease;
}
.stat-pct{
  font-size:12px;
  color:var(--near-black);
  font-weight:500;
  min-width:28px;
  text-align:right;
}

/* ── Empty state ── */
.empty-state{
  text-align:center;
  padding:48px 24px;
  color:var(--silver);
  font-size:14px;
}
.empty-state p{margin-top:8px;font-size:13px;color:var(--silver)}

/* ── No-class indicator ── */
.no-class-note{
  text-align:center;
  padding:32px;
  color:var(--silver);
  font-size:14px;
}

/* ── Tabs (session tabs for Saturday) ── */
.session-tabs{
  display:flex;
  gap:6px;
  padding:16px 20px 0;
}
.session-tab{
  padding:6px 16px;
  border-radius:9999px;
  border:none;
  font-size:13px;
  cursor:pointer;
  transition:background .12s,color .12s;
  font-family:inherit;
}
.session-tab.active{
  background:var(--light-gray);
  color:var(--near-black);
  font-weight:500;
}
.session-tab:not(.active){
  background:transparent;
  color:var(--stone);
}
.session-tab:not(.active):hover{
  background:var(--snow);
  color:var(--near-black);
}

/* ── Footer ── */
footer{
  text-align:center;
  padding:24px;
  font-size:12px;
  color:var(--silver);
  border-top:1px solid var(--light-gray);
  margin-top:48px;
}

/* ── Mobile ── */
@media(max-width:480px){
  nav{padding:0 16px}
  .app{padding:20px 16px 60px}
  .cal-day{font-size:13px}
  .day-num{width:26px;height:26px;font-size:13px}
  .cal-day.today .day-num,.cal-day.selected .day-num{width:26px;height:26px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
}

/* ── Scroll ── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--light-gray);border-radius:9999px}
</style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <svg width="20" height="20" viewBox="0 0 24 24">
      <circle cx="9" cy="7" r="2"/>
      <circle cx="15" cy="7" r="2"/>
      <path d="M5 12h14M5 12a7 7 0 0 0 14 0"/>
      <path d="M9 17v2M15 17v2"/>
    </svg>
    드럼 출결 관리
  </div>
  <button class="nav-today-btn" onclick="goToday()">오늘</button>
</nav>

<div class="app">
  <div class="month-nav">
    <span class="month-title" id="monthTitle"></span>
    <div class="nav-arrows">
      <button class="arrow-btn" onclick="changeMonth(-1)" aria-label="이전 달">
        <svg width="16" height="16" viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg>
      </button>
      <button class="arrow-btn" onclick="changeMonth(1)" aria-label="다음 달">
        <svg width="16" height="16" viewBox="0 0 24 24"><polyline points="9,18 15,12 9,6"/></svg>
      </button>
    </div>
  </div>

  <div class="cal-wrap">
    <div class="cal-header">
      <div class="cal-header-cell">일</div>
      <div class="cal-header-cell">월</div>
      <div class="cal-header-cell">화</div>
      <div class="cal-header-cell">수</div>
      <div class="cal-header-cell">목</div>
      <div class="cal-header-cell">금</div>
      <div class="cal-header-cell">토</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div id="detailPanel"></div>

  <div class="stats-section" id="statsSection"></div>
</div>

<footer>드럼 수업 출결 관리 시스템</footer>

<script>
// ── Schedule Data ──────────────────────────────────────────────
const SCHEDULE = {
  2: { // Tuesday 화요일
    label: '화요일',
    sessions: [{
      id: 'tue',
      location: '숭의교회',
      time: null,
      students: [
        { id: 'teacher1', name: '선생님' },
        { id: 'teacher2', name: '여자 선생님' }
      ]
    }]
  },
  3: { // Wednesday 수요일
    label: '수요일',
    sessions: [{
      id: 'wed',
      location: '부평구청 연습실',
      time: null,
      students: [
        { id: 'chanyoung', name: '찬영' }
      ]
    }]
  },
  6: { // Saturday 토요일
    label: '토요일',
    sessions: [
      {
        id: 'sat-am',
        location: '안양성결교회',
        time: '오전',
        students: [
          { id: 'dael',    name: '다엘' },
          { id: 'jihu',    name: '지후' },
          { id: 'jian',    name: '지안' },
          { id: 'jonghwa', name: '종화' },
          { id: 'siwon',   name: '시원' }
        ]
      },
      {
        id: 'sat-pm',
        location: '시흥중앙성결교회',
        time: '오후',
        students: [
          { id: 'junhyuk', name: '준혁' },
          { id: 'junseo',  name: '준서' },
          { id: 'hangyul', name: '한결' }
        ]
      }
    ]
  },
  0: { // Sunday 일요일
    label: '일요일',
    sessions: [{
      id: 'sun-pm',
      location: '',
      time: '오후 3시',
      students: [
        { id: 'eunhyuk', name: '은혁' },
        { id: 'uije',    name: '위제' }
      ]
    }]
  }
};

// ── State ─────────────────────────────────────────────────────
const today = new Date();
let viewYear  = today.getFullYear();
let viewMonth = today.getMonth();
let selectedDateKey = null;
let activeSessionTab = {}; // dateKey → sessionId

function loadAttendance(){
  try{ return JSON.parse(localStorage.getItem('drum_attendance') || '{}'); }
  catch(e){ return {}; }
}
function saveAttendance(data){
  localStorage.setItem('drum_attendance', JSON.stringify(data));
}
let attendance = loadAttendance();

// ── Helpers ────────────────────────────────────────────────────
function dateKey(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function parseDK(dk){ const [y,m,d]=dk.split('-').map(Number); return {y,m:m-1,d}; }

function getDayOfWeek(y,m,d){ return new Date(y,m,d).getDay(); }

function getScheduleForDate(dk){
  const {y,m,d} = parseDK(dk);
  const dow = getDayOfWeek(y,m,d);
  return SCHEDULE[dow] || null;
}

function isPresent(dk, studentId){
  return !!(attendance[dk] && attendance[dk][studentId] === true);
}
function isAbsent(dk, studentId){
  return !!(attendance[dk] && attendance[dk][studentId] === false);
}
function isPristine(dk, studentId){
  return !(attendance[dk] && attendance[dk][studentId] !== undefined);
}

function toggleStudent(dk, studentId){
  if(!attendance[dk]) attendance[dk] = {};
  const cur = attendance[dk][studentId];
  if(cur === undefined){ attendance[dk][studentId] = true; }       // pristine → present
  else if(cur === true){ attendance[dk][studentId] = false; }      // present → absent
  else { delete attendance[dk][studentId]; }                       // absent → pristine (reset)
  saveAttendance(attendance);
  renderDetail();
  renderStats();
}

// ── Calendar Render ────────────────────────────────────────────
function renderCalendar(){
  const title = document.getElementById('monthTitle');
  const grid  = document.getElementById('calGrid');

  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  title.textContent = `${viewYear}년 ${months[viewMonth]}`;

  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const lastDate = new Date(viewYear, viewMonth+1, 0).getDate();
  const prevLastDate = new Date(viewYear, viewMonth, 0).getDate();

  let html = '';

  // prev month padding
  for(let i=0; i<firstDay; i++){
    const pday = prevLastDate - firstDay + 1 + i;
    const pm = viewMonth - 1, py = pm < 0 ? viewYear-1 : viewYear;
    const pm2 = pm < 0 ? 11 : pm;
    const dk = dateKey(py, pm2, pday);
    const dow = getDayOfWeek(py, pm2, pday);
    const hasCls = !!SCHEDULE[dow];
    html += dayCell(pday, dk, hasCls, false, false, true);
  }

  // current month
  for(let d=1; d<=lastDate; d++){
    const dk = dateKey(viewYear, viewMonth, d);
    const dow = getDayOfWeek(viewYear, viewMonth, d);
    const hasCls = !!SCHEDULE[dow];
    const isTdy = (d===today.getDate() && viewMonth===today.getMonth() && viewYear===today.getFullYear());
    const isSel = (dk === selectedDateKey);
    html += dayCell(d, dk, hasCls, isTdy, isSel, false);
  }

  // next month padding
  const totalCells = firstDay + lastDate;
  const remainder = 7 - (totalCells % 7);
  if(remainder < 7){
    for(let d=1; d<=remainder; d++){
      const nm = viewMonth+1, ny = nm>11?viewYear+1:viewYear, nm2=nm>11?0:nm;
      const dk = dateKey(ny, nm2, d);
      const dow = getDayOfWeek(ny, nm2, d);
      const hasCls = !!SCHEDULE[dow];
      html += dayCell(d, dk, hasCls, false, false, true);
    }
  }

  grid.innerHTML = html;
}

function dayCell(d, dk, hasCls, isToday, isSel, isOther){
  const sched = SCHEDULE[getDayOfWeek(...dk.split('-').map((v,i)=>i===1?Number(v)-1:Number(v)))];
  const dotCount = sched ? sched.sessions.length : 0;
  const dots = Array(dotCount).fill('<span class="day-dot"></span>').join('');

  const classes = [
    'cal-day',
    hasCls ? 'has-class' : '',
    isToday ? 'today' : '',
    isSel   ? 'selected' : '',
    isOther ? 'other-month' : ''
  ].filter(Boolean).join(' ');

  const clickAttr = hasCls ? `onclick="selectDate('${dk}')"` : '';
  return `<div class="${classes}" ${clickAttr}>
    <span class="day-num">${d}</span>
    ${dotCount > 0 ? `<div class="day-dots">${dots}</div>` : '<div style="height:5px"></div>'}
  </div>`;
}

// ── Select Date ────────────────────────────────────────────────
function selectDate(dk){
  if(selectedDateKey === dk){
    selectedDateKey = null;
  } else {
    selectedDateKey = dk;
    // default active tab
    const sched = getScheduleForDate(dk);
    if(sched && !activeSessionTab[dk]){
      activeSessionTab[dk] = sched.sessions[0].id;
    }
  }
  renderCalendar();
  renderDetail();
}

// ── Detail Panel ───────────────────────────────────────────────
function renderDetail(){
  const panel = document.getElementById('detailPanel');
  if(!selectedDateKey){
    panel.innerHTML = '';
    return;
  }

  const sched = getScheduleForDate(selectedDateKey);
  if(!sched){
    panel.innerHTML = `<div class="detail-panel"><div class="no-class-note">이날은 수업이 없습니다</div></div>`;
    return;
  }

  const {y,m,d} = parseDK(selectedDateKey);
  const weekdays = ['일','월','화','수','목','금','토'];
  const dow = getDayOfWeek(y,m,d);
  const dateLabel = `${y}년 ${m+1}월 ${d}일 (${weekdays[dow]})`;

  // Count all students present/total for the day
  let totalPresent=0, totalStudents=0;
  sched.sessions.forEach(s=>{
    s.students.forEach(st=>{
      totalStudents++;
      if(isPresent(selectedDateKey, st.id)) totalPresent++;
    });
  });

  const isFuture = new Date(y,m,d) > new Date(today.getFullYear(), today.getMonth(), today.getDate());

  // Tabs (only for multi-session days like Saturday)
  const multiSession = sched.sessions.length > 1;
  const activeTab = activeSessionTab[selectedDateKey] || sched.sessions[0].id;

  let tabsHtml = '';
  if(multiSession){
    tabsHtml = `<div class="session-tabs">` +
      sched.sessions.map(s=>`
        <button class="session-tab${s.id===activeTab?' active':''}" onclick="switchTab('${selectedDateKey}','${s.id}')">
          ${s.location}${s.time?` ${s.time}`:''}
        </button>`
      ).join('') +
      `</div>`;
  }

  // Sessions to render
  const sessionsToRender = multiSession
    ? sched.sessions.filter(s => s.id === activeTab)
    : sched.sessions;

  let sessionsHtml = sessionsToRender.map(session => {
    const studentPills = session.students.map(st => {
      const present = isPresent(selectedDateKey, st.id);
      const absent  = isAbsent(selectedDateKey, st.id);
      let pillClass = 'student-pill';
      if(present) pillClass += ' present';
      if(absent)  pillClass += ' absent';

      const checkIcon = `<svg class="pill-check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="2.5,8 6,11.5 13.5,4.5"/></svg>`;
      const xIcon = `<svg class="pill-x" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg>`;

      return `<button class="${pillClass}" onclick="toggleStudent('${selectedDateKey}','${st.id}')">
        ${checkIcon}${xIcon}${st.name}
      </button>`;
    }).join('');

    const sessionPresent = session.students.filter(st=>isPresent(selectedDateKey,st.id)).length;
    const sessionTotal   = session.students.length;
    const locLabel = [session.location, session.time].filter(Boolean).join(' · ');

    return `<div class="session-block">
      <div class="session-header">
        ${session.location ? `<span class="session-location">${session.location}</span>` : ''}
        ${session.time ? `<span class="session-time-badge">${session.time}</span>` : ''}
      </div>
      <div class="student-list">${studentPills}</div>
      ${!isFuture && sessionTotal>0 ? `<p style="margin-top:12px;font-size:12px;color:var(--silver)">
        클릭: 출석 → 결석 → 초기화 순으로 전환됩니다
      </p>` : ''}
    </div>`;
  }).join('');

  const summaryText = isFuture ? '예정' : `${totalPresent} / ${totalStudents}명 출석`;

  panel.innerHTML = `<div class="detail-panel">
    <div class="detail-date-bar">
      <span class="detail-date-label">${dateLabel}</span>
      <span class="attendance-summary">${summaryText}</span>
    </div>
    ${tabsHtml}
    ${sessionsHtml}
  </div>`;
}

function switchTab(dk, sessionId){
  activeSessionTab[dk] = sessionId;
  renderDetail();
}

// ── Stats ──────────────────────────────────────────────────────
function renderStats(){
  const sec = document.getElementById('statsSection');

  // Build stats per student: count sessions held (past, not future), count present
  const statsMap = {}; // studentId → { name, sessions, present }

  Object.values(SCHEDULE).forEach(dayInfo => {
    dayInfo.sessions.forEach(session => {
      session.students.forEach(st => {
        if(!statsMap[st.id]) statsMap[st.id] = { name: st.name, sessions: 0, present: 0 };
      });
    });
  });

  // Count from attendance data
  Object.entries(attendance).forEach(([dk, records]) => {
    const {y,m,d} = parseDK(dk);
    const date = new Date(y,m,d);
    const todayDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    if(date > todayDate) return; // skip future

    Object.entries(records).forEach(([studentId, val]) => {
      if(!statsMap[studentId]) return;
      if(val === true){
        statsMap[studentId].present++;
        statsMap[studentId].sessions++;
      } else if(val === false){
        statsMap[studentId].sessions++;
      }
    });
  });

  // Only show students who have at least one recorded session
  const students = Object.entries(statsMap)
    .filter(([,v]) => v.sessions > 0)
    .sort(([,a],[,b]) => (b.present/Math.max(b.sessions,1)) - (a.present/Math.max(a.sessions,1)));

  if(students.length === 0){
    sec.innerHTML = '';
    return;
  }

  const cards = students.map(([id, data]) => {
    const pct = data.sessions > 0 ? Math.round(data.present / data.sessions * 100) : 0;
    return `<div class="stat-card">
      <div class="stat-name">${data.name}</div>
      <div class="stat-bar-row">
        <div class="stat-bar-bg">
          <div class="stat-bar-fill" style="width:${pct}%"></div>
        </div>
        <span class="stat-pct">${pct}%</span>
      </div>
      <div style="margin-top:6px;font-size:11px;color:var(--silver)">${data.present}/${data.sessions}회</div>
    </div>`;
  }).join('');

  sec.innerHTML = `<div class="stats-title">출석률</div>
    <div class="stats-grid">${cards}</div>`;
}

// ── Month Navigation ────────────────────────────────────────────
function changeMonth(dir){
  viewMonth += dir;
  if(viewMonth > 11){ viewMonth=0; viewYear++; }
  if(viewMonth < 0) { viewMonth=11; viewYear--; }
  selectedDateKey = null;
  renderCalendar();
  renderDetail();
}

function goToday(){
  viewYear  = today.getFullYear();
  viewMonth = today.getMonth();
  selectedDateKey = null;
  renderCalendar();
  renderDetail();
}

// ── Init ───────────────────────────────────────────────────────
renderCalendar();
renderDetail();
renderStats();
</script>
